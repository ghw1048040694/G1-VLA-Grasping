[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-vla"
version = "0.2.0"
description = "G1 upper-body VLA and world-model experiment lifecycle"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
simulation = ["numpy==1.26.4", "mujoco==3.2.5", "torch>=2.6,<2.7", "scipy>=1.10,<2", "imageio>=2.37,<3"]

[project.scripts]
g1-vla = "g1_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["g1_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
